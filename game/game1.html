<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỹ Năng Sống - Quyết Định Tình Huống</title>
    <!-- Tải Tailwind CSS để tạo giao diện hiện đại -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdfa; /* Teal 50 */
        }
        .game-card {
            box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .choice-button {
            transition: all 0.2s;
            transform: scale(1);
        }
        .choice-button:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .correct-choice {
            background-color: #34d399 !important; /* Green 400 */
            color: white;
            border: 2px solid #059669;
        }
        .incorrect-choice {
            background-color: #f87171 !important; /* Red 400 */
            color: white;
            border: 2px solid #dc2626;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center">

    <!-- Thanh Tiêu đề và Nút Quay lại -->
    <header class="w-full max-w-2xl flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-teal-700">Giải Quyết Tình Huống</h1>
        <a href="/index.html" class="px-4 py-2 bg-teal-600 text-white text-sm font-semibold rounded-lg shadow-md hover:bg-teal-700 transition duration-200">
            Quay lại Web Chính
        </a>
    </header>

    <!-- Khu vực Trò chơi Chính -->
    <main id="gameContainer" class="game-card w-full max-w-2xl bg-white p-6 md:p-10 rounded-xl flex flex-col gap-6">

        <!-- Phần Thông tin Tình huống -->
        <div id="scenarioSection" class="border-b pb-6 mb-6">
            <p class="text-lg font-semibold text-teal-600 mb-2">Tình huống <span id="currentNumber">1</span>/<span id="totalNumber">5</span></p>
            <div id="scoreDisplay" class="text-2xl font-bold text-blue-600 mb-4">
                Điểm Kỹ năng: 0
            </div>
            <h2 id="scenarioText" class="text-xl md:text-2xl font-semibold text-gray-800 bg-blue-50 p-4 rounded-lg border border-blue-200">
                Tải tình huống...
            </h2>
        </div>

        <!-- Phần Lựa chọn Hành động -->
        <div id="choicesSection" class="grid grid-cols-1 gap-4">
            <!-- Các nút lựa chọn sẽ được chèn tại đây bởi JavaScript -->
        </div>

        <!-- Phần Phản hồi (Feedback) và Nút Tiếp tục -->
        <div id="feedbackSection" class="mt-4 flex flex-col items-center hidden">
            <p id="feedbackMessage" class="text-xl font-bold p-3 rounded-lg"></p>
            <button id="nextButton" onclick="nextScenario()" class="mt-4 px-8 py-3 bg-teal-500 text-white text-lg font-semibold rounded-lg hover:bg-teal-600 transition duration-200 focus:outline-none focus:ring-4 focus:ring-teal-300">
                Tiếp tục
            </button>
        </div>

        <!-- Phần Kết thúc Game -->
        <div id="endGameSection" class="text-center p-8 hidden">
            <h2 class="text-3xl font-bold text-teal-700 mb-4">Hoàn thành Thử thách Kỹ năng Sống!</h2>
            <p class="text-xl text-gray-700 mb-6">Bạn đã hoàn thành tất cả các tình huống.</p>
            <p class="text-4xl font-extrabold text-blue-700">Điểm Kỹ năng Cuối cùng: <span id="finalScore">0</span></p>
            <p id="skillLevel" class="text-2xl mt-4 font-semibold text-teal-600"></p>
            <button onclick="window.location.reload()" class="mt-8 px-8 py-3 bg-pink-500 text-white text-lg font-semibold rounded-lg hover:bg-pink-600 transition duration-200 focus:outline-none focus:ring-4 focus:ring-pink-300">
                Chơi Lại
            </button>
        </div>
    </main>

    <script>
        // Mảng chứa các tình huống, lựa chọn và kết quả (kỹ năng sống)
        const scenarios = [
            {
                id: 1,
                text: "Bạn thấy một chiếc ví dày cộm bị đánh rơi trên đường đi học. Không có ai xung quanh.",
                choices: [
                    { text: "Bỏ qua và tiếp tục đi, sợ bị liên lụy.", isCorrect: false, feedback: "Hành động này thiếu trách nhiệm. Kỹ năng sống quan trọng là phải có tính trung thực và trách nhiệm với cộng đồng." },
                    { text: "Nhặt lên, tìm thông tin liên lạc và tìm cách trả lại cho chủ nhân.", isCorrect: true, feedback: "Rất tốt! Bạn đã thể hiện tính Trung thực và Trách nhiệm. Đây là một kỹ năng sống nền tảng." },
                    { text: "Mở ví ra đếm tiền, sau đó nhờ người lớn giữ hộ.", isCorrect: false, feedback: "Mục đích là tốt, nhưng không nên mở ví ra. Tốt nhất là nhờ người lớn (như giáo viên hoặc bảo vệ) xử lý ngay lập tức để đảm bảo tính minh bạch." }
                ]
            },
            {
                id: 2,
                text: "Một người bạn thân của bạn đang rất buồn vì trượt kỳ thi quan trọng. Bạn nên làm gì?",
                choices: [
                    { text: "Nói rằng: 'Thôi đừng buồn nữa, chuyện nhỏ mà.'", isCorrect: false, feedback: "Việc phủ nhận cảm xúc của người khác không giúp ích. Kỹ năng lắng nghe đồng cảm là quan trọng hơn." },
                    { text: "Lắng nghe một cách chân thành, để bạn ấy nói hết nỗi lòng, và đề nghị giúp đỡ ôn tập cho lần sau.", isCorrect: true, feedback: "Tuyệt vời! Bạn đã thể hiện Kỹ năng Lắng nghe Đồng cảm và Hỗ trợ. Đây là cách tốt nhất để xây dựng mối quan hệ." },
                    { text: "Kể về một lần bạn cũng trượt để họ thấy 'không sao cả'.", isCorrect: false, feedback: "Chia sẻ kinh nghiệm cá nhân có thể tốt, nhưng trước tiên, hãy ưu tiên Lắng nghe và xác nhận cảm xúc của họ." }
                ]
            },
            {
                id: 3,
                text: "Bạn cảm thấy quá tải và căng thẳng vì có quá nhiều bài tập và dự án phải hoàn thành trong tuần.",
                choices: [
                    { text: "Cố gắng thức khuya để làm hết mọi thứ ngay lập tức.", isCorrect: false, feedback: "Việc này gây hại cho sức khỏe và thường dẫn đến hiệu suất thấp. Kỹ năng Quản lý Căng thẳng và Sắp xếp Công việc chưa được áp dụng." },
                    { text: "Dành 15 phút để lập danh sách ưu tiên, chọn việc quan trọng nhất làm trước, sau đó nghỉ giải lao ngắn.", isCorrect: true, feedback: "Chính xác! Bạn đã áp dụng Kỹ năng Quản lý Thời gian, Quản lý Căng thẳng và Tự chăm sóc bản thân (Self-care)."},
                    { text: "Xin phép giáo viên cho nghỉ học một ngày để làm bài tập.", isCorrect: false, feedback: "Việc né tránh trách nhiệm không giải quyết vấn đề lâu dài. Hãy đối mặt bằng cách lập kế hoạch." }
                ]
            },
            {
                id: 4,
                text: "Bạn đang làm việc nhóm và một thành viên liên tục chỉ trích ý kiến của bạn một cách gay gắt.",
                choices: [
                    { text: "Cãi lại họ bằng thái độ tương tự, bảo vệ ý kiến của mình đến cùng.", isCorrect: false, feedback: "Điều này làm leo thang xung đột. Cần áp dụng Kỹ năng Giải quyết Xung đột và Giao tiếp Tích cực." },
                    { text: "Bình tĩnh hít thở, nói: 'Tôi hiểu quan điểm của bạn. Chúng ta có thể thảo luận từng điểm một được không?'", isCorrect: true, feedback: "Xuất sắc! Bạn đã sử dụng Kỹ năng Giải quyết Xung đột và Tự kiểm soát Cảm xúc. Điều này giúp giữ cho cuộc thảo luận mang tính xây dựng." },
                    { text: "Im lặng và chấp nhận ý kiến của họ để tránh xung đột.", isCorrect: false, feedback: "Né tránh xung đột không phải là giải pháp tốt nhất. Kỹ năng Thuyết phục và Bảo vệ Quan điểm Lành mạnh là cần thiết." }
                ]
            },
            {
                id: 5,
                text: "Bạn vô tình làm đổ nước lên bàn phím máy tính của thư viện. Không có ai nhìn thấy.",
                choices: [
                    { text: "Lén lau khô rồi giả vờ như không có gì xảy ra.", isCorrect: false, feedback: "Che giấu vấn đề là thiếu trách nhiệm. Hư hỏng có thể tệ hơn nếu không được xử lý ngay." },
                    { text: "Báo cáo ngay lập tức với nhân viên thư viện, xin lỗi và đề xuất giúp đỡ khắc phục.", isCorrect: true, feedback: "Tuyệt vời! Bạn đã áp dụng Kỹ năng Chịu trách nhiệm và Giao tiếp Chủ động. Trung thực là điều quan trọng nhất." },
                    { text: "Đợi người khác đến và hỏi xem họ có thấy gì không.", isCorrect: false, feedback: "Bạn nên chủ động chịu trách nhiệm về hành động của mình, không nên chờ đợi." }
                ]
            }
        ];

        let currentScenarioIndex = 0;
        let skillScore = 0;
        let isProcessing = false; // Ngăn chặn người dùng click nhiều lần

        const gameContainer = document.getElementById('gameContainer');
        const scenarioText = document.getElementById('scenarioText');
        const choicesSection = document.getElementById('choicesSection');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const feedbackSection = document.getElementById('feedbackSection');
        const feedbackMessage = document.getElementById('feedbackMessage');
        const nextButton = document.getElementById('nextButton');
        const endGameSection = document.getElementById('endGameSection');
        const currentNumber = document.getElementById('currentNumber');
        const totalNumber = document.getElementById('totalNumber');
        const finalScore = document.getElementById('finalScore');
        const skillLevel = document.getElementById('skillLevel');

        totalNumber.textContent = scenarios.length;

        // Hàm cập nhật điểm
        function updateScore(points) {
            skillScore += points;
            scoreDisplay.textContent = `Điểm Kỹ năng: ${skillScore}`;
        }

        // Hàm tải tình huống hiện tại
        function loadScenario() {
            if (currentScenarioIndex >= scenarios.length) {
                endGame();
                return;
            }

            isProcessing = false;
            feedbackSection.classList.add('hidden');
            nextButton.classList.add('hidden');
            choicesSection.innerHTML = '';
            choicesSection.classList.remove('hidden');

            const current = scenarios[currentScenarioIndex];
            
            // Cập nhật giao diện
            currentNumber.textContent = currentScenarioIndex + 1;
            scenarioText.textContent = current.text;

            // Tạo các nút lựa chọn
            current.choices.forEach((choice, index) => {
                const button = document.createElement('button');
                button.textContent = choice.text;
                button.className = 'choice-button w-full text-left p-4 bg-gray-100 text-gray-800 rounded-lg hover:bg-teal-100 font-medium transition duration-200';
                button.onclick = () => handleChoice(index, button);
                button.disabled = false;
                choicesSection.appendChild(button);
            });
        }

        // Hàm xử lý khi người dùng chọn
        function handleChoice(choiceIndex, clickedButton) {
            if (isProcessing) return;
            isProcessing = true;
            
            const current = scenarios[currentScenarioIndex];
            const chosen = current.choices[choiceIndex];

            // Vô hiệu hóa tất cả các nút sau khi chọn
            Array.from(choicesSection.children).forEach(button => {
                button.disabled = true;
                // Thêm hiệu ứng cho các lựa chọn khác
                if (button !== clickedButton) {
                    button.classList.remove('hover:bg-teal-100');
                    button.classList.add('opacity-50');
                }
            });


            if (chosen.isCorrect) {
                updateScore(10); // Cộng 10 điểm cho hành động đúng
                clickedButton.classList.add('correct-choice');
                showFeedback(true, chosen.feedback);
            } else {
                clickedButton.classList.add('incorrect-choice');
                // Highlight đáp án đúng
                current.choices.forEach((choice, index) => {
                    if (choice.isCorrect) {
                        choicesSection.children[index].classList.add('correct-choice', 'animate-pulse');
                    }
                });
                showFeedback(false, chosen.feedback);
            }

            // Hiện nút Tiếp tục
            feedbackSection.classList.remove('hidden');
            nextButton.classList.remove('hidden');
        }

        // Hàm hiển thị phản hồi
        function showFeedback(isCorrect, message) {
            feedbackMessage.textContent = message;
            if (isCorrect) {
                feedbackMessage.className = 'text-xl font-bold p-3 rounded-lg bg-green-100 text-green-700 border border-green-300';
            } else {
                feedbackMessage.className = 'text-xl font-bold p-3 rounded-lg bg-red-100 text-red-700 border border-red-300';
            }
        }

        // Hàm chuyển sang tình huống tiếp theo
        function nextScenario() {
            currentScenarioIndex++;
            loadScenario();
        }

        // Hàm kết thúc trò chơi
        function endGame() {
            gameContainer.classList.add('hidden');
            endGameSection.classList.remove('hidden');
            finalScore.textContent = skillScore;

            let levelMessage = "";
            if (skillScore >= scenarios.length * 10 * 0.8) {
                levelMessage = "Cấp độ Kỹ năng: Siêu Đẳng (Xuất sắc! Bạn có những quyết định rất chín chắn.)";
            } else if (skillScore >= scenarios.length * 10 * 0.5) {
                levelMessage = "Cấp độ Kỹ năng: Khá (Bạn có nền tảng vững vàng, cần cải thiện thêm kỹ năng giải quyết xung đột.)";
            } else {
                levelMessage = "Cấp độ Kỹ năng: Cần Cố gắng (Hãy xem lại phần giải thích để rút ra bài học kinh nghiệm!)";
            }
            skillLevel.textContent = levelMessage;
        }

        // Khởi động game khi tải trang
        window.onload = loadScenario;
    </script>
</body>
</html>
