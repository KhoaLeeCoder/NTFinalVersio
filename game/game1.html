<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Anh Hùng Kỹ Năng Sống</title>
    <!-- Tải Tailwind CSS để tạo giao diện hiện đại, responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cài đặt font Inter cho giao diện thân thiện -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Màu nền nhẹ nhàng */
            min-height: 100vh;
        }
        /* Hiệu ứng cho nút hành động */
        .btn-action {
            transition: all 0.2s;
        }
        /* Chỉ áp dụng hiệu ứng hover trên màn hình md trở lên */
        @media (min-width: 768px) {
            .btn-action:hover {
                transform: translateY(-3px); /* Tăng độ nảy */
                box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            }
        }
        /* Thẻ câu hỏi cơ bản */
        .question-card {
            min-height: 400px;
            transition: transform 0.5s ease-out; /* Thêm hiệu ứng chuyển đổi */
        }
        /* Animation nhỏ khi câu hỏi mới được tải */
        @keyframes subtle-shake {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.005); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-subtle-shake {
            animation: subtle-shake 0.3s ease-out;
        }
        /* Style cho các nút đáp án */
        #answer-buttons button {
            transition: background-color 0.15s, border-color 0.15s, transform 0.15s;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Header & Nút Quay Về Web Chính -->
    <header class="flex justify-between items-center mb-8">
        <h1 class="text-3xl md:text-4xl font-extrabold text-blue-700">
            Siêu Anh Hùng Kỹ Năng Sống
        </h1>
        <!-- Nút Quay Về Web Chính - Dùng placeholder URL -->
        <a href="/index.html" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-full shadow-lg transition duration-200 text-sm md:text-base">
            <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Quay Về Web Chính
        </a>
    </header>

    <!-- Container Chính Của Ứng Dụng -->
    <main class="max-w-3xl mx-auto bg-white p-6 md:p-10 rounded-2xl shadow-2xl border-b-4 border-blue-500">

        <!-- Màn Hình 1: Bắt Đầu Game -->
        <div id="start-screen" class="screen flex flex-col items-center text-center">
            <h2 class="text-3xl font-bold text-gray-800 mb-4">Chào Mừng! Hãy Sẵn Sàng Trở Thành Người Hùng!</h2>
            <p class="text-7xl mb-8">🛡️</p>
            <p class="text-gray-600 mb-8 text-lg">Bạn sẽ đối mặt với **10 THỬ THÁCH** kỹ năng sống, được chia thành 3 Sứ Mệnh quan trọng. Hãy sẵn sàng!</p>
            
            <button onclick="startGame()" class="btn-action bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full text-xl shadow-md">
                BẮT ĐẦU NHIỆM VỤ
            </button>
        </div>

        <!-- Màn Hình 2: Trò Chơi Quiz -->
        <div id="quiz-screen" class="screen hidden">
            <!-- Khu vực Hiển thị điểm số và tiến trình -->
            <div class="flex justify-between items-center mb-4">
                <p class="text-lg font-semibold text-blue-600">
                    Sứ Mệnh <span id="current-level">1</span>: <span id="level-title">An Toàn Cơ Bản</span>
                </p>
                <p class="text-lg font-semibold text-green-600">Điểm: <span id="current-score">0</span></p>
            </div>
            
            <!-- Thanh tiến trình cấp độ -->
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                <div id="level-progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            
            <div id="question-card" class="question-card bg-blue-50 p-6 rounded-xl shadow-inner mb-6 animate-subtle-shake">
                <p class="text-sm font-medium text-blue-500 mb-2">Câu Hỏi: <span id="question-index"></span></p>
                <h3 id="question-text" class="text-xl md:text-2xl font-semibold text-gray-800 leading-relaxed">
                    <!-- Nội dung câu hỏi và icon chủ đề sẽ hiển thị ở đây. -->
                </h3>
            </div>
            
            <!-- Khu Vực Đáp Án -->
            <div id="answer-buttons" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Buttons will be injected here by JavaScript -->
            </div>

            <!-- Khu Vực Phản Hồi -->
            <div id="feedback-message" class="mt-6 p-4 rounded-lg text-center hidden font-bold text-lg">
                <!-- Feedback (Correct/Incorrect) will be injected here -->
            </div>
        </div>

        <!-- Màn Hình 3: Kết Quả -->
        <div id="result-screen" class="screen hidden flex flex-col items-center text-center">
            <h2 class="text-3xl font-bold text-gray-800 mb-4">HOÀN THÀNH SỨ MỆNH!</h2>
            <p id="final-icon" class="text-8xl mb-4">🏆</p>
            <p class="text-5xl font-extrabold mb-6 text-indigo-600">
                <span id="final-score">0</span> / <span id="final-total-questions"></span>
            </p>

            <div id="result-message" class="text-xl mb-8 p-4 rounded-lg border-2 w-full max-w-sm">
                <!-- Custom message based on score -->
            </div>
            

            <button onclick="window.location.reload()" class="btn-action bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-full text-lg shadow-md mt-4">
                CHƠI LẠI (THỬ THÁCH MỚI)
            </button>
        </div>

    </main>

    <script>
        // Khai báo dữ liệu câu hỏi, thêm level và topicIcon
        const quizData = [
            {
                level: 1, // Sứ Mệnh 1: An Toàn Cơ Bản (Gia Đình)
                topic: "Phòng Cháy",
                topicIcon: "🔥",
                question: "Khi phát hiện một đám cháy nhỏ trong nhà, hành động ưu tiên nhất của bạn là gì?",
                options: [
                    "Bỏ chạy ra ngoài ngay lập tức.",
                    "Sử dụng bình chữa cháy mini hoặc vật dụng sẵn có để dập lửa, đồng thời hô hoán.",
                    "Đứng nhìn và chờ người lớn đến giải quyết.",
                    "Dùng nước dội vào đám cháy (Áp dụng cho mọi loại cháy)."
                ],
                correct: 1, 
                explanation: "Ưu tiên hàng đầu là sử dụng các công cụ chữa cháy tại chỗ để dập lửa khi đám cháy còn nhỏ, và gọi sự giúp đỡ. Tuyệt đối không dùng nước dập các đám cháy do điện hoặc dầu mỡ."
            },
            {
                level: 1,
                topic: "An Toàn Điện",
                topicIcon: "⚡",
                question: "Nếu thấy dây điện bị đứt và rơi xuống đất, bạn nên làm gì?",
                options: [
                    "Dùng tay không kéo dây điện ra khỏi nơi nguy hiểm.",
                    "Đứng xa, giữ khoảng cách an toàn và gọi ngay cho người lớn hoặc tổng đài khẩn cấp.",
                    "Dùng một thanh gỗ dài để đẩy dây điện đi.",
                    "Lấy nước dội lên dây điện để ngăn cháy."
                ],
                correct: 1,
                explanation: "Tuyệt đối không chạm vào dây điện trần. Giữ khoảng cách an toàn và gọi cứu hộ là hành động đúng đắn nhất."
            },
            {
                level: 1,
                topic: "Sơ Cứu Đứt Tay",
                topicIcon: "🔪",
                question: "Khi bị vết thương đứt tay nhẹ chảy máu, bạn nên làm gì đầu tiên?",
                options: [
                    "Chườm đá lạnh trực tiếp lên vết thương.",
                    "Rửa vết thương dưới vòi nước sạch và dùng băng gạc sạch cầm máu.",
                    "Bôi trực tiếp kem đánh răng hoặc lá cây.",
                    "Dùng tay bóp mạnh vết thương để máu chảy ra hết."
                ],
                correct: 1,
                explanation: "Rửa sạch vết thương để loại bỏ bụi bẩn, sau đó cầm máu bằng băng gạc sạch là quy trình sơ cứu chuẩn."
            },
            {
                level: 2, // Sứ Mệnh 2: Đối Phó Thiên Tai
                topic: "Phòng Lũ Lụt",
                topicIcon: "🌊",
                question: "Nghe tin cảnh báo lũ lụt lớn sắp đến, bạn nên chuẩn bị những vật dụng thiết yếu nào?",
                options: [
                    "Chỉ cần quần áo và điện thoại di động.",
                    "Thực phẩm khô, nước uống sạch, đèn pin, bộ sơ cứu y tế, áo phao.",
                    "Chỉ cần tiền mặt và giấy tờ tùy thân.",
                    "Sách vở và đồ chơi yêu thích để giết thời gian."
                ],
                correct: 1,
                explanation: "Thực phẩm, nước sạch, sơ cứu, và các công cụ chiếu sáng là vật dụng quan trọng nhất để tồn tại an toàn trong và sau lũ lụt."
            },
            {
                level: 2,
                topic: "Động Đất",
                topicIcon: "🚨",
                question: "Khi đang ở trong nhà và cảm thấy động đất, bạn nên làm gì?",
                options: [
                    "Chạy thật nhanh ra khỏi nhà.",
                    "Đứng gần cửa sổ hoặc tường.",
                    "Thực hiện động tác 'Drop, Cover, and Hold On' (Cúi xuống, Che chắn, và Nắm chặt) dưới gầm bàn chắc chắn.",
                    "Chạy lên tầng cao hơn để tránh đổ vỡ."
                ],
                correct: 2,
                explanation: "Nguyên tắc 'Drop, Cover, and Hold On' dưới gầm bàn chắc chắn là phương pháp tốt nhất khi động đất xảy ra trong nhà để tránh các vật thể rơi xuống đầu."
            },
            {
                level: 2,
                topic: "Vệ Sinh & Thực Phẩm",
                topicIcon: "🍽️",
                question: "Làm thế nào để phân biệt thực phẩm an toàn và thực phẩm không an toàn sau một trận lũ?",
                options: [
                    "Tất cả thực phẩm đóng hộp đều an toàn.",
                    "Chỉ ăn những thực phẩm khô, không bị ngấm nước lũ.",
                    "Ăn bất cứ thứ gì có sẵn vì đói.",
                    "Ăn cả thực phẩm tươi và thực phẩm đã bị nước lũ chạm vào sau khi rửa sạch."
                ],
                correct: 1,
                explanation: "Thực phẩm bị nước lũ chạm vào có nguy cơ nhiễm khuẩn cao và nên được loại bỏ. Chỉ nên ăn thực phẩm đóng gói kín hoặc thực phẩm khô không tiếp xúc với nước lũ."
            },
            {
                level: 3, // Sứ Mệnh 3: Phản Ứng Khẩn Cấp & Công Cộng
                topic: "An Toàn Nước",
                topicIcon: "🏊",
                question: "Nếu thấy một người đang bị đuối nước mà bạn không biết bơi, hành động nào là đúng đắn nhất?",
                options: [
                    "Nhảy xuống nước ngay lập tức để cứu người đó.",
                    "Nhanh chóng tìm kiếm vật dụng nổi (phao, dây, gậy) để ném cho nạn nhân và hô hoán cầu cứu.",
                    "Đứng trên bờ la hét.",
                    "Chạy đi tìm điện thoại để gọi 113."
                ],
                correct: 1,
                explanation: "Tuyệt đối không tự mình nhảy xuống nếu không có kỹ năng cứu hộ. Sử dụng vật dụng nổi để kéo nạn nhân lên bờ là ưu tiên hàng đầu."
            },
            {
                level: 3,
                topic: "An Toàn Giao Thông",
                topicIcon: "🚦",
                question: "Khi tín hiệu đèn giao thông chuyển từ xanh sang vàng, bạn cần làm gì?",
                options: [
                    "Tăng tốc nhanh chóng để vượt qua ngã tư.",
                    "Giữ tốc độ, chuẩn bị dừng lại trước vạch.",
                    "Dừng lại ngay lập tức (trừ khi quá gần vạch dừng).",
                    "Quan sát và nếu không có xe khác thì đi tiếp."
                ],
                correct: 1,
                explanation: "Đèn vàng báo hiệu sắp chuyển sang đèn đỏ. Bạn phải dừng lại trước vạch dừng. Chỉ tiếp tục đi nếu bạn đã vượt qua vạch hoặc quá gần vạch dừng và không thể dừng an toàn."
            },
            {
                level: 3,
                topic: "Sơ Cứu",
                topicIcon: "🚑",
                question: "Khi có người bị ngất xỉu, hành động sơ cứu nào là **không** nên làm?",
                options: [
                    "Để nạn nhân nằm ngửa, kê chân cao hơn đầu một chút.",
                    "Nới lỏng quần áo, thắt lưng, khăn quàng cổ.",
                    "Xoa dầu gió hoặc tát vào mặt nạn nhân để gọi tỉnh.",
                    "Kiểm tra đường thở của nạn nhân và gọi cấp cứu."
                ],
                correct: 2,
                explanation: "Việc xoa dầu gió hoặc tát mạnh không có tác dụng và có thể làm tình trạng nạn nhân tệ hơn. Việc cần làm là giữ thông thoáng, kiểm tra hơi thở và gọi sự trợ giúp y tế."
            },
            {
                level: 3,
                topic: "Tránh xa nguy hiểm",
                topicIcon: "🚧",
                question: "Khi thấy biển báo 'Công trường đang thi công' hoặc 'Khu vực nguy hiểm', bạn nên làm gì?",
                options: [
                    "Tiến lại gần để xem có gì thú vị.",
                    "Đi vòng qua, giữ khoảng cách và cảnh báo cho bạn bè.",
                    "Tìm cách thử thách sự nguy hiểm.",
                    "Đứng yên tại chỗ."
                ],
                correct: 1,
                explanation: "Các biển báo này nhằm cảnh báo các mối nguy hiểm tiềm ẩn (như sụp lún, vật liệu rơi). Việc tránh xa và cảnh báo là hành động bảo vệ bản thân và cộng đồng."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuizData = [];
        const totalQuestions = quizData.length;
        let currentLevel = 1;
        const maxLevel = 3;


        // Lấy các element cần thiết
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionText = document.getElementById('question-text');
        const questionCard = document.getElementById('question-card');
        const answerButtonsContainer = document.getElementById('answer-buttons');
        const feedbackMessage = document.getElementById('feedback-message');
        const questionIndexSpan = document.getElementById('question-index');
        // const totalQuestionsSpan = document.getElementById('total-questions'); // Lỗi: ID này không còn tồn tại trong HTML
        const finalScoreSpan = document.getElementById('final-score');
        const finalTotalQuestionsSpan = document.getElementById('final-total-questions');
        const resultMessageDiv = document.getElementById('result-message');
        const finalIconDiv = document.getElementById('final-icon');
        const currentScoreSpan = document.getElementById('current-score');
        const currentLevelSpan = document.getElementById('current-level');
        const levelTitleSpan = document.getElementById('level-title');
        const levelProgressBar = document.getElementById('level-progress-bar');


        // Thiết lập tổng số câu hỏi khi tải trang
        // totalQuestionsSpan.textContent = totalQuestions; // Lỗi: ID này không còn tồn tại trong HTML


        /**
         * Hàm xáo trộn mảng (Fisher-Yates Shuffle)
         * @param {Array} array - Mảng cần xáo trộn
         */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        /**
         * Hàm ẩn tất cả màn hình
         */
        function hideAllScreens() {
            startScreen.classList.add('hidden');
            quizScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
        }

        function getLevelTitle(level) {
            switch(level) {
                case 1: return "An Toàn Cơ Bản (Gia Đình)";
                case 2: return "Đối Phó Thiên Tai";
                case 3: return "Phản Ứng Khẩn Cấp & Công Cộng";
                default: return "Sứ Mệnh Đã Hoàn Thành";
            }
        }

        /**
         * Bắt đầu trò chơi và khởi tạo cấp độ
         */
        function startGame() {
            // Xáo trộn câu hỏi TỔNG THỂ
            let shuffledAllData = shuffleArray([...quizData]);
            
            // Group questions by level and shuffle them internally for good measure
            const groupedQuestions = {};
            shuffledAllData.forEach(q => {
                const level = q.level;
                if (!groupedQuestions[level]) {
                    groupedQuestions[level] = [];
                }
                groupedQuestions[level].push(q);
            });
            
            // Re-order the levels (1, 2, 3) and flatten them back into shuffledQuizData
            shuffledQuizData = [];
            for (let l = 1; l <= maxLevel; l++) {
                if (groupedQuestions[l]) {
                    shuffledQuizData.push(...groupedQuestions[l]);
                }
            }

            hideAllScreens();
            quizScreen.classList.remove('hidden');
            currentQuestionIndex = 0;
            currentLevel = 1;
            score = 0;
            currentScoreSpan.textContent = score;
            
            loadLevel();
        }

        /**
         * Tải các thông tin của cấp độ hiện tại
         */
        function loadLevel() {
            if (currentLevel > maxLevel) {
                showResult();
                return;
            }
            
            currentLevelSpan.textContent = currentLevel;
            levelTitleSpan.textContent = getLevelTitle(currentLevel);
            
            // Đảm bảo loadQuestion được gọi để hiển thị câu hỏi đầu tiên của level mới
            loadQuestion();
        }

        /**
         * Cập nhật thanh tiến trình
         */
        function updateProgress() {
            const currentLevelQuestions = shuffledQuizData.filter(q => q.level === currentLevel);
            // Tìm index trong mảng tổng thể
            const startIndex = shuffledQuizData.findIndex(q => q.level === currentLevel);
            // Vị trí câu hỏi hiện tại trong cấp độ (từ 0)
            const questionsAnsweredInLevel = currentQuestionIndex - startIndex;
            const totalQuestionsInLevel = currentLevelQuestions.length;
            
            const progressPercentage = (questionsAnsweredInLevel / totalQuestionsInLevel) * 100;
            levelProgressBar.style.width = `${progressPercentage}%`;
        }

        /**
         * Tải câu hỏi hiện tại và hiển thị lên giao diện
         */
        function loadQuestion() {
            feedbackMessage.classList.add('hidden');
            answerButtonsContainer.innerHTML = ''; // Xóa các nút cũ
            
            // Xóa hiệu ứng lắc cũ và thêm lại để kích hoạt animation
            questionCard.classList.remove('animate-subtle-shake');
            void questionCard.offsetWidth; // Force reflow/repaint
            questionCard.classList.add('animate-subtle-shake');


            if (currentQuestionIndex >= shuffledQuizData.length) {
                showResult();
                return;
            }

            const currentQuestion = shuffledQuizData[currentQuestionIndex];
            
            // Cập nhật chỉ số câu hỏi
            // Tìm vị trí của câu hỏi hiện tại trong mảng tổng thể, sau đó +1
            const globalIndex = shuffledQuizData.indexOf(currentQuestion) + 1;
            questionIndexSpan.textContent = globalIndex;

            // Cập nhật nội dung câu hỏi (thêm icon chủ đề)
            questionText.innerHTML = `<span class="text-4xl mr-3 align-middle">${currentQuestion.topicIcon}</span> ${currentQuestion.question}`;

            // Tạo các nút đáp án
            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.setAttribute('data-index', index);
                button.onclick = () => checkAnswer(index);

                // Styling cho nút đáp án (Tailwind Classes)
                // SỬA LỖI: Chuyển 'hover:bg-yellow-100' thành 'md:hover:bg-yellow-100'
                // Thêm 'active:bg-yellow-100' để có phản hồi nhấn trên mobile
                button.className = 'btn-action text-left p-4 rounded-xl font-medium shadow-md transition duration-150 ' + 
                                   'bg-white text-gray-700 md:hover:bg-yellow-100 md:hover:text-blue-800 active:bg-yellow-100 border-2 border-gray-200';
                
                answerButtonsContainer.appendChild(button);
            });
            
            updateProgress(); // Cập nhật tiến trình sau khi tải câu hỏi
        }

        /**
         * Kiểm tra đáp án người chơi chọn
         * @param {number} selectedIndex - Index của đáp án người chơi chọn
         */
        function checkAnswer(selectedIndex) {
            const currentQuestion = shuffledQuizData[currentQuestionIndex];
            const isCorrect = selectedIndex === currentQuestion.correct;
            
            // Vô hiệu hóa tất cả các nút để ngăn chặn chọn lại
            Array.from(answerButtonsContainer.children).forEach(button => {
                button.disabled = true;
                // SỬA LỖI: Xóa class active và hover để tránh bị dính màu
                button.classList.remove('md:hover:bg-yellow-100', 'md:hover:text-blue-800', 'active:bg-yellow-100');

                const index = parseInt(button.getAttribute('data-index'));
                
                // Đánh dấu đáp án đúng/sai
                if (index === currentQuestion.correct) {
                    // Đáp án đúng (Màu xanh lá)
                    button.classList.remove('bg-white', 'text-gray-700', 'border-gray-200');
                    button.classList.add('bg-green-100', 'border-green-500', 'text-green-700', 'font-bold', 'shadow-lg');
                } else if (index === selectedIndex) {
                    // Đáp án người chơi chọn sai (Màu đỏ)
                    button.classList.remove('bg-white', 'text-gray-700', 'border-gray-200');
                    button.classList.add('bg-red-100', 'border-red-500', 'text-red-700', 'shadow-lg');
                }
            });

            // Hiển thị phản hồi
            feedbackMessage.classList.remove('hidden');
            if (isCorrect) {
                score++;
                currentScoreSpan.textContent = score;
                feedbackMessage.innerHTML = '🎉 **Chính Xác!** ' + currentQuestion.explanation;
                feedbackMessage.className = 'mt-6 p-4 rounded-lg text-center font-bold text-lg bg-green-100 text-green-700 border-l-4 border-green-500 shadow-md';
            } else {
                feedbackMessage.innerHTML = '❌ **Chưa Chính Xác!** ' + currentQuestion.explanation;
                feedbackMessage.className = 'mt-6 p-4 rounded-lg text-center font-bold text-lg bg-red-100 text-red-700 border-l-4 border-red-500 shadow-md';
            }

            // Cập nhật tiến trình ngay sau khi trả lời
            updateProgress();

            // Chuyển sang câu hỏi tiếp theo sau 3.5 giây
            setTimeout(() => {
                currentQuestionIndex++;
                
                // Kiểm tra nếu câu hỏi tiếp theo là của cấp độ mới
                if (currentQuestionIndex < shuffledQuizData.length) {
                    const nextQuestion = shuffledQuizData[currentQuestionIndex];
                    if (nextQuestion.level !== currentLevel) {
                        currentLevel = nextQuestion.level;
                        loadLevel();
                    } else {
                        loadQuestion();
                    }
                } else {
                    showResult();
                }

            }, 3500); 
        }

        /**
         * Hiển thị màn hình kết quả
         */
        function showResult() {
            hideAllScreens();
            resultScreen.classList.remove('hidden');

            finalScoreSpan.textContent = score;
            finalTotalQuestionsSpan.textContent = totalQuestions;

            let message = "";
            let messageClass = "";
            let finalIcon = "";

            if (score === totalQuestions) {
                message = "🌟 HOÀN HẢO! Bạn đã hoàn thành 3 Sứ Mệnh và là một SIÊU ANH HÙNG KỸ NĂNG SỐNG thực thụ!";
                messageClass = "text-green-700 bg-green-50 border-green-500";
                finalIcon = "🥇";
            } else if (score >= totalQuestions * 0.7) {
                message = "Tuyệt Vời! Bạn đã vượt qua hầu hết các thử thách. Tiếp tục rèn luyện để chinh phục điểm tuyệt đối!";
                messageClass = "text-blue-700 bg-blue-50 border-blue-500";
                finalIcon = "🏆";
            } else if (score >= totalQuestions / 2) {
                 message = "Rất Tốt! Bạn đã nắm được những kiến thức cơ bản. Hãy thử lại để trở thành người hùng!";
                messageClass = "text-yellow-700 bg-yellow-50 border-yellow-500";
                finalIcon = "💪";
            } else {
                message = "Cần cố gắng hơn. Kiến thức kỹ năng sống rất quan trọng, hãy xem lại phần giải thích và thử lại nhé!";
                messageClass = "text-red-700 bg-red-50 border-red-500";
                finalIcon = "💡";
            }

            resultMessageDiv.textContent = message;
            resultMessageDiv.className = `text-xl mb-8 p-4 rounded-lg border-2 w-full max-w-sm font-semibold ${messageClass}`;
            finalIconDiv.textContent = finalIcon;
        }

        // Khởi động màn hình ban đầu
        window.onload = function() {
            hideAllScreens();
            startScreen.classList.remove('hidden');
        };

    </script>
</body>
</html>
