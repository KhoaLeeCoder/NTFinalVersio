<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỹ Năng Siêu Việt - Trình Giả Lập AI</title>
    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tải Icon Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tải thư viện Marked để render Markdown (khắc phục lỗi chữ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.12/marked.min.js"></script>
    <style>
        /* Thiết lập font Inter mặc định */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        /* Custom scrollbar cho khu vực chat/scenario */
        #scenario-output {
            max-height: 400px;
            overflow-y: auto;
            border-radius: 0.5rem;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }
        .ai-message {
            background-color: #e0f2f1; /* Teal light */
        }
        .user-message {
            background-color: #eff6ff; /* Blue light */
        }
        /* Style cho nội dung Markdown đã được chuyển đổi */
        #scenario-output p { margin-bottom: 0.5rem; }
        #scenario-output ul, #scenario-output ol { margin-left: 1.5rem; list-style-type: disc; margin-bottom: 0.5rem; }
        #scenario-output li { margin-bottom: 0.25rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="app" class="flex flex-col flex-grow items-center justify-center p-4 md:p-8">
        <!-- Nút Quay về Web Chính (Yêu cầu bắt buộc) -->
        <div class="w-full max-w-4xl flex justify-end mb-4">
             <!-- Vui lòng thay thế '#' bằng URL web chính của bạn -->
            <a href="/index.html" id="return-button" onclick="returnToMainWeb(event)" class="flex items-center space-x-2 text-sm font-medium text-indigo-600 hover:text-indigo-800 transition duration-150">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Quay về Web Chính</span>
            </a>
        </div>

        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-extrabold text-indigo-700 tracking-tight">Luyện Kỹ Năng Mềm Cùng AI</h1>
            <p class="text-lg text-gray-600 mt-2">Trình Giả Lập & Huấn Luyện Kỹ Năng Mềm Ứng Dụng AI</p>
        </header>

        <main id="main-content" class="w-full max-w-4xl bg-white p-6 md:p-10 rounded-xl shadow-2xl transition duration-500">
            
            <!-- Vùng 1: Chọn Kỹ Năng -->
            <div id="skill-selection" class="space-y-6">
                <h2 class="text-2xl font-bold text-gray-800 border-b pb-3 mb-4 flex items-center">
                    <i data-lucide="brain-circuit" class="w-6 h-6 mr-3 text-indigo-500"></i>
                    Chọn Kỹ Năng Bạn Muốn Phát Triển
                </h2>

                <div class="grid md:grid-cols-2 gap-6">
                    <!-- Kỹ năng Thuyết Trình -->
                    <button onclick="selectSkill('presentation')" class="skill-card bg-white p-6 border-2 border-indigo-200 rounded-lg shadow-md hover:shadow-lg transition transform hover:scale-[1.02] duration-300 flex flex-col items-start text-left">
                        <i data-lucide="mic-2" class="w-8 h-8 text-indigo-600 mb-3"></i>
                        <span class="text-xl font-semibold text-gray-800">Kỹ Năng Thuyết Trình</span>
                        <p class="text-gray-500 text-sm mt-1">Luyện tập sự tự tin, cấu trúc bài nói và tương tác với khán giả.</p>
                    </button>
                    <!-- Kỹ năng Quản Lý Cảm Xúc -->
                    <button onclick="selectSkill('emotion')" class="skill-card bg-white p-6 border-2 border-green-200 rounded-lg shadow-md hover:shadow-lg transition transform hover:scale-[1.02] duration-300 flex flex-col items-start text-left">
                        <i data-lucide="leaf" class="w-8 h-8 text-green-600 mb-3"></i>
                        <span class="text-xl font-semibold text-gray-800">Kỹ Năng Quản Lý Cảm Xúc</span>
                        <p class="text-gray-500 text-sm mt-1">Học cách nhận diện, điều chỉnh cảm xúc trong các tình huống áp lực.</p>
                    </button>
                </div>
            </div>

            <!-- Vùng 2: Giả Lập Kịch Bản -->
            <div id="simulation-area" class="hidden space-y-6">
                <!-- Nút Quay lại -->
                <button onclick="backToSelection()" class="flex items-center text-sm font-medium text-gray-500 hover:text-indigo-600 mb-4 transition duration-150 p-2 border border-gray-200 rounded-lg">
                    <i data-lucide="chevron-left" class="w-4 h-4 mr-1"></i>
                    <span>Chọn Lại Kỹ Năng</span>
                </button>
                <!-- Tiêu đề kỹ năng -->
                <h2 class="text-2xl font-bold text-gray-800 border-b pb-3 mb-4 flex items-center">
                    <i data-lucide="scroll-text" id="skill-icon" class="w-6 h-6 mr-3 text-indigo-500"></i>
                    Huấn Luyện Viên AI: <span id="current-skill-name" class="ml-2 text-indigo-600"></span>
                </h2>

                <!-- Khu vực hiển thị Kịch bản & Phản hồi -->
                <div id="scenario-output" class="bg-gray-100 p-4 space-y-4 shadow-inner">
                    <!-- Nội dung hội thoại sẽ được thêm vào đây -->
                </div>

                <!-- Vùng nhập phản hồi của người dùng -->
                <div class="mt-6">
                    <label for="user-response" class="block text-lg font-medium text-gray-700 mb-2">Phản hồi của bạn:</label>
                    <textarea id="user-response" rows="4" placeholder="Nhập câu trả lời hoặc hành động của bạn tại đây để AI đánh giá và đưa ra kịch bản mới..." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 shadow-sm"></textarea>
                    
                    <button onclick="submitResponse()" id="submit-button" class="mt-3 w-full md:w-auto px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 transition duration-300 flex items-center justify-center space-x-2">
                        <i data-lucide="send" class="w-5 h-5"></i>
                        <span>Gửi Phản Hồi & Nhận Phân Tích</span>
                    </button>
                </div>

                <!-- Vùng Loading/Thông báo -->
                <div id="loading-message" class="hidden mt-4 p-4 bg-yellow-100 text-yellow-800 rounded-lg flex items-center space-x-3">
                    <i data-lucide="loader-circle" class="w-5 h-5 animate-spin"></i>
                    <span>AI đang phân tích phản hồi và tạo kịch bản tiếp theo. Vui lòng chờ...</span>
                </div>
            </div>
            
            <!-- Vùng Thông báo/Lỗi -->
            <div id="error-message" class="hidden mt-4 p-4 bg-red-100 text-red-800 rounded-lg">
                Đã xảy ra lỗi trong quá trình giao tiếp với AI. Vui lòng thử lại.
            </div>
        </main>
    </div>

    <!-- Firebase SDKs và Scripts (MANDATORY BOILERPLATE) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // --- 1. BIẾN TOÀN CỤC BẮT BUỘC TỪ MÔI TRƯỜNG CANVAS ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // KIỂM TRA MÔI TRƯỜNG: Nếu __app_id không tồn tại, ta đang chạy cục bộ (local).
        const isLocalEnvironment = typeof __app_id === 'undefined';

        let db, auth, userId = 'loading';
        let isAuthReady = false;

        // --- 2. KHỞI TẠO FIREBASE VÀ XÁC THỰC (Không thay đổi) ---
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            onAuthStateChanged(auth, async (user) => {
                if (user) { userId = user.uid; } 
                else {
                    if (initialAuthToken) {
                        try {
                            await signInWithCustomToken(auth, initialAuthToken);
                        } catch (error) {
                            console.error("Lỗi đăng nhập bằng custom token:", error);
                            await signInAnonymously(auth);
                            userId = auth.currentUser.uid;
                        }
                    } else {
                        await signInAnonymously(auth);
                        userId = auth.currentUser.uid;
                    }
                }
                isAuthReady = true;
                console.log("Firebase Auth đã sẵn sàng. User ID:", userId);
            });

        } catch (e) {
            console.error("Lỗi khởi tạo Firebase:", e);
        }

        // --- 3. LOGIC APP CHÍNH (Gán cho window để có thể gọi từ HTML) ---
        
        // API Configuration (Đã điều chỉnh để đảm bảo Canvas tự động inject API Key)
        const API_KEY = ""; 
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${API_KEY}`;
        
        let currentSkill = '';
        let conversationHistory = [];

        // Hỗ trợ đánh dấu icon
        const lucide = window.lucide;
        // lucide.createIcons(); // Đã xóa khỏi DOMContentLoaded, chỉ gọi khi cần

        // Hàm chung để hiển thị tin nhắn trong giao diện (ĐÃ CẬP NHẬT ĐỂ SỬ DỤNG MARKED)
        window.displayMessage = (sender, text) => {
            const outputArea = document.getElementById('scenario-output');
            const messageDiv = document.createElement('div');
            
            const senderName = sender === 'ai' ? 'Huấn Luyện Viên AI' : 'Phản Hồi Của Bạn';
            const bgColor = sender === 'ai' ? 'ai-message' : 'user-message';
            const icon = sender === 'ai' ? 'scroll-text' : 'user';

            // CHUYỂN ĐỔI MARKDOWN SANG HTML TRƯỚC KHI HIỂN THỊ
            // FIX: Thêm kiểm tra 'window.marked' trước khi gọi 'parse'
            let htmlContent = `<p>${text}</p>`; // Mặc định là plain text
            if (sender === 'ai' && typeof window.marked !== 'undefined') {
                 // Dùng window.marked.parse(text)
                htmlContent = window.marked.parse(text); 
            } else if (sender === 'ai') {
                console.warn("Thư viện Marked chưa được tải. Hiển thị dưới dạng plain text.");
            }

            messageDiv.className = `${bgColor} p-4 rounded-xl shadow-sm break-words`;
            messageDiv.innerHTML = `
                <div class="font-bold text-gray-700 flex items-center space-x-2 mb-2">
                    <i data-lucide="${icon}" class="w-4 h-4"></i>
                    <span>${senderName}</span>
                </div>
                <!-- Sử dụng innerHTML để hiển thị nội dung đã được Markdown render -->
                <div class="text-gray-800">
                    ${htmlContent}
                </div>
            `;
            outputArea.appendChild(messageDiv);
            outputArea.scrollTop = outputArea.scrollHeight; 
            lucide.createIcons(); // Gọi lại để render icon cho tin nhắn mới
        };

        // Hàm Xử lý API Call với Exponential Backoff (Không thay đổi)
        async function fetchWithBackoff(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        // Throw error to trigger retry logic
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return await response.json();
                } catch (error) {
                    console.error(`Lỗi API (thử lại lần ${i + 1}/${maxRetries}):`, error);
                    if (i === maxRetries - 1) throw error; 
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }
        
        // --- CHỨC NĂNG MOCK API ĐỂ CHẠY CỤC BỘ (CẬP NHẬT ĐỊNH DẠNG MARKDOWN) ---
        function mockApiCall(history, skill) {
            console.warn("Chạy trong môi trường cục bộ: Sử dụng phản hồi giả lập (mock API).");
            return new Promise(resolve => {
                // Mô phỏng độ trễ mạng 1.5 giây
                setTimeout(() => {
                    const skillText = skill === 'presentation' ? 'Thuyết trình' : 'Quản lý Cảm xúc';
                    // Đảm bảo phản hồi Markdown được định dạng tốt để thư viện marked xử lý
                    const mockResponseText = `
1. **Phân tích Phản hồi:** Phản hồi của bạn cho thấy bạn đã ưu tiên việc điều chỉnh trạng thái tâm lý trước khi hành động, đây là một bước khởi đầu rất tốt trong tình huống áp lực của bài tập ${skillText}! Hành động "bình tĩnh" là nền tảng vững chắc.

2. **Lời khuyên Chuyên sâu:**
* Hãy xác định **mục tiêu cụ thể** của lần phản hồi/thuyết trình tiếp theo (VD: mục tiêu cao nhất là gì?).
* Áp dụng kỹ thuật **Tóm tắt (T.A.C):** **T**hông cảm, **A**p dụng giải pháp, **C**am kết hành động, để tạo ra phản hồi/bài nói chuyên nghiệp.

3. **Kịch bản Tiếp theo:** Sau khi đã giữ được sự bình tĩnh, ban lãnh đạo yêu cầu bạn tập trung vào phần Tài chính trong bài thuyết trình 5 phút. Bạn sẽ sử dụng những luận điểm nào và nói như thế nào để gây ấn tượng trong thời gian ngắn ngủi này?
                    `;

                    // Cấu trúc phản hồi giả lập giống với cấu trúc API thật
                    resolve({
                        candidates: [{
                            content: {
                                parts: [{
                                    text: mockResponseText
                                }]
                            }
                        }]
                    });
                }, 1500); 
            });
        }
        // --- KẾT THÚC MOCK API ---

        window.selectSkill = async (skill) => {
            currentSkill = skill;
            conversationHistory = [];
            
            const skillName = skill === 'presentation' ? 'Kỹ Năng Thuyết Trình' : 'Kỹ Năng Quản Lý Cảm Xúc';
            const skillIcon = skill === 'presentation' ? 'mic-2' : 'leaf';
            
            document.getElementById('current-skill-name').textContent = skillName;
            document.getElementById('skill-icon').setAttribute('data-lucide', skillIcon);
            document.getElementById('scenario-output').innerHTML = ''; 
            
            document.getElementById('skill-selection').classList.add('hidden');
            document.getElementById('simulation-area').classList.remove('hidden');
            
            lucide.createIcons(); // Cập nhật icon cho tiêu đề

            // Bắt đầu kịch bản đầu tiên
            const initialPrompt = skill === 'presentation' 
                ? "Chào mừng bạn đến với mô phỏng kỹ năng Thuyết trình. Hãy bắt đầu với kịch bản đầu tiên: Bạn được yêu cầu trình bày nhanh (5 phút) về một dự án mới trước ban lãnh đạo trong 10 phút nữa. Bạn sẽ chuẩn bị và hành động như thế nào?"
                : "Chào mừng bạn đến với mô phỏng kỹ năng Quản lý Cảm xúc. Hãy bắt đầu với kịch bản đầu tiên: Bạn vừa nhận được email phản hồi gay gắt từ một khách hàng quan trọng. Bạn cảm thấy khó chịu và muốn phản ứng ngay lập tức. Bạn sẽ xử lý cảm xúc và phản hồi email này như thế nào?";
            
            // THAY ĐỔI QUAN TRỌNG: Thêm tin nhắn vào lịch sử trước, sau đó hiển thị
            conversationHistory.push({ role: "model", parts: [{ text: initialPrompt }] });
            displayMessage('ai', initialPrompt);
        };

        // --- HÀM QUAY LẠI CHỌN KỸ NĂNG ---
        window.backToSelection = () => {
            document.getElementById('simulation-area').classList.add('hidden');
            document.getElementById('skill-selection').classList.remove('hidden');
            document.getElementById('user-response').value = ''; // Xóa input cũ
            document.getElementById('scenario-output').innerHTML = ''; // Xóa hội thoại cũ
            document.getElementById('error-message').classList.add('hidden'); // Ẩn lỗi (nếu có)
            currentSkill = '';
            conversationHistory = [];
            console.log("Quay lại màn hình chọn kỹ năng.");
        };
        // ----------------------------------

        window.submitResponse = async () => {
            const userResponseText = document.getElementById('user-response').value.trim();
            const submitBtn = document.getElementById('submit-button');
            const loadingMsg = document.getElementById('loading-message');
            const errorMsg = document.getElementById('error-message');

            if (!userResponseText) {
                errorMsg.textContent = "Vui lòng nhập phản hồi của bạn.";
                errorMsg.classList.remove('hidden');
                return;
            }
            errorMsg.classList.add('hidden');

            displayMessage('user', userResponseText);
            
            // Tin nhắn người dùng luôn được thêm vào lịch sử
            conversationHistory.push({ role: "user", parts: [{ text: userResponseText }] });

            // Vô hiệu hóa nút và hiển thị loading
            submitBtn.disabled = true;
            loadingMsg.classList.remove('hidden');

            try {
                let result;

                if (isLocalEnvironment) {
                    // SỬ DỤNG MOCK API KHI CHẠY CỤC BỘ
                    result = await mockApiCall(conversationHistory, currentSkill);
                } else {
                    // SỬ DỤNG API THẬT KHI CHẠY TRONG MÔI TRƯỜNG CANVAS/LIVE
                    const systemInstruction = 
                        `Bạn là một chuyên gia huấn luyện kỹ năng mềm (${currentSkill === 'presentation' ? 'Kỹ Năng Thuyết Trình' : 'Kỹ Năng Quản Lý Cảm Xúc'}). 
                        Nhiệm vụ của bạn là đánh giá phản hồi gần nhất của người dùng, cung cấp lời khuyên chuyên sâu và sau đó tạo ra một kịch bản mới cho họ để tiếp tục luyện tập. 
                        Đảm bảo tính chuyên nghiệp, khích lệ và thân thiện.
                        
                        CẤU TRÚC PHẢN HỒI CỦA BẠN PHẢI TUÂN THỦ CHẶT CHẼ ĐỊNH DẠNG SỐ VÀ IN ĐẬM SAU (Sử dụng Markdown). KHÔNG ĐƯỢC DÙNG DẤU THĂNG (#) HOẶC BẤT KỲ HEADER NÀO KHÁC TRONG TOÀN BỘ PHẢN HỒI.
                        
                        1. **Phân tích Phản hồi:** Đánh giá hành động của người dùng (Khoảng 2-3 câu).
                        2. **Lời khuyên Chuyên sâu:** Đưa ra 1-2 mẹo/kỹ thuật cụ thể để cải thiện (Sử dụng gạch đầu dòng \`-\` hoặc dấu sao \`*\`).
                        3. **Kịch bản Tiếp theo:** Đặt ra một tình huống mới liên quan để người dùng phản hồi tiếp.
                        
                        Giới hạn tổng thể phản hồi của bạn dưới 200 từ tiếng Việt.`;
                    
                    // Sử dụng API_URL đã được định nghĩa chuẩn ở đầu script
                    const apiUrl = API_URL;


                    const payload = {
                        contents: conversationHistory,
                        tools: [{ "google_search": {} }], 
                        systemInstruction: {
                            parts: [{ text: systemInstruction }]
                        },
                    };
                    
                    result = await fetchWithBackoff(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }


                const candidate = result.candidates?.[0];
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const aiText = candidate.content.parts[0].text;
                    displayMessage('ai', aiText); // Hiển thị phản hồi AI

                    // THÊM PHẢN HỒI AI VÀO LỊCH SỬ
                    conversationHistory.push({ role: "model", parts: [{ text: aiText }] });
                    
                    document.getElementById('user-response').value = ''; 
                } else {
                    throw new Error("Cấu trúc phản hồi AI không hợp lệ hoặc lỗi API.");
                }

            } catch (e) {
                console.error("Lỗi trong quá trình giao tiếp/gọi API AI:", e);
                errorMsg.textContent = "Không thể kết nối với Huấn luyện viên AI. Vui lòng kiểm tra kết nối mạng hoặc thử lại sau.";
                errorMsg.classList.remove('hidden');
            } finally {
                // Khôi phục trạng thái nút và loading
                submitBtn.disabled = false;
                loadingMsg.classList.add('hidden');
            }
        };

        window.returnToMainWeb = (event) => {
            console.log("Điều hướng quay về web chính...");
        };
        
        // Khởi tạo icons lần đầu
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

    </script>
</body>
</html>
